name: taiwan_transit
description: "台灣大眾運輸時刻表整合 App（台鐵 / 公車 / 高鐵 / 捷運）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 用於呼叫自建後端 API（後端再向 TDX 取資料）
  http: ^1.2.2
  # 日期時間格式化 / 剖析
  intl: ^0.20.3
  # 取得裝置定位（用於自動帶入最近車站）
  geolocator: ^13.0.1
  # 本機 SQLite（歷史查詢與常用路線，離線不需網路）
  sqflite: ^2.3.0
  # 取得 App 版本資訊（設定頁顯示版本）
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
